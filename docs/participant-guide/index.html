<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>피카츄 배구 봇 대회 — 참가자 가이드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SW 교류전 피카츄 배구 봇 대회 참가자용 가이드" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #ffcb05;
      --theme-color-secondary: #3b4cca;
    }
    .markdown-section code { background-color: #f6f8fa; }
    .markdown-section pre { background-color: #0d1117; }
    .markdown-section pre > code { color: #e6edf3; background-color: transparent; }
    .sidebar-nav > ul > li > p { font-weight: 700; color: #3b4cca; }
  </style>
</head>
<body>
  <div id="app">가이드 로딩 중...</div>
  <script>
    window.$docsify = {
      name: '피카츄 배구 봇 가이드',
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        placeholder: '검색',
        noData: '결과 없음',
        depth: 3,
      },
      copyCode: {
        buttonText: '복사',
        errorText: '실패',
        successText: '복사됨',
      },
      pagination: {
        previousText: '이전',
        nextText: '다음',
        crossChapter: true,
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
